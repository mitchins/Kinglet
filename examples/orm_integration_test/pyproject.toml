[project]
name = "kinglet-orm-integration-test"
version = "1.7.0"
description = "Integration test for Kinglet 1.7.0 Micro-ORM"
dependencies = [
    "kinglet @ git+https://github.com/mitchins/Kinglet.git",
]

[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

# Deploy-only project: nothing here is distributed as a package.
[tool.setuptools]
py-modules = []

[dependency-groups]
dev = ["workers-py"]
